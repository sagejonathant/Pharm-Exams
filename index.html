/* ============================================================
   STATE
   ============================================================ */

const $ = s => document.querySelector(s);
let S = null;
let showCounts = false;
let tick = null;

function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function fmt(ms){
  const s = Math.floor(ms/1000);
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}

/* ============================================================
   ROUND SETUP
   ============================================================ */

function startRound(key, only){
  const R = ROUNDS[key];
  document.documentElement.style.setProperty('--accent', R.accent);
  document.documentElement.style.setProperty('--accent-soft', R.accentSoft);

  S = {key, R, kind: key==='insulin' ? 'insulin' : 'class',
       placed:0, total:0, misses:0, selected:null, t0:Date.now(), done:false,
       review:reviewMode, canInfo:false, errors:new Map()};

  $('#round-title').textContent = R.title;
  $('#round-sub').textContent = reviewMode
    ? 'Everything is sorted for you. Tap any box for the mechanism, indication, adverse effects, nursing points, and what sets each drug apart.'
    : R.sub;
  $('#footnote').innerHTML = R.note ? 'Note. '+R.note : '';
  $('#btn-principles').hidden = !R.principles;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', String(t.dataset.round===key)));
  $('#btn-counts').style.display = S.kind==='class' ? '' : 'none';

  clearHint();
  if(S.kind==='class') buildClassRound(R, only); else buildInsulinRound(R, only);
  applyNames();

  if(reviewMode){ fillEverything(); S.done = true; enableInfo(); }

  $('#s-total').textContent = S.total;
  updateStats();
  clearInterval(tick);
  tick = setInterval(()=>{ if(!S.done) $('#s-time').textContent = fmt(Date.now()-S.t0); },500);
  $('#s-time').textContent='0:00';
  window.scrollTo({top:0});
}

function buildClassRound(R, only){
  const board = $('#board');
  board.className = 'board';
  board.innerHTML = '';
  const pool = $('#pool');
  pool.className = 'pool';
  pool.innerHTML = '';

  const useBins = only ? R.bins.filter(b=>b.items.some(i=>only.has(i.g))) : R.bins;
  const tiles = [];

  useBins.forEach(bin=>{
    const el = document.createElement('div');
    el.className = 'bin';
    el.dataset.bin = bin.id;
    el.tabIndex = 0;
    el.setAttribute('role','button');
    const items = only ? bin.items.filter(i=>only.has(i.g)) : bin.items;
    el.dataset.need = items.length;
    el.innerHTML =
      '<div class="binhead"><span class="binname">'+bin.name+'</span>'+
      '<span class="bincount" data-count>'+(showCounts? '0/'+items.length : '')+'</span>'+
      '<span class="infodot" aria-hidden="true">i</span></div>'+
      '<div class="bindrop"><div class="emptyhint">Drop here</div></div>';
    board.appendChild(el);
    items.forEach(it=> tiles.push({...it, bin:bin.id, binName:bin.name}));
  });

  S.total = tiles.length;
  shuffle(tiles).forEach(t=>pool.appendChild(makeTile(t)));
  $('#dock-title').textContent = 'Drag a drug into its class';
  refreshDock();
}

function makeTile(t){
  const b = document.createElement('button');
  b.type='button';
  b.className='tile';
  b.dataset.bin = t.bin;
  b.dataset.g = t.g;
  b.dataset.fact = t.f || '';
  b.dataset.binName = t.binName;
  if(!t.b) b.setAttribute('data-nobrand','');
  const tag = t.x ? '<span class="bonus-tag">bonus</span>' : '';
  b.innerHTML = '<span class="g">'+t.g+tag+'</span>'+(t.b?'<span class="b">'+t.b+tag+'</span>':'');
  b.setAttribute('aria-label', t.g + (t.b? ', '+t.b : '') + (t.x? ', bonus, not on the med list' : ''));
  attachDrag(b);
  return b;
}

/* generic / brand / both, applies to the word bank only */
let nameMode = 'both';
function applyNames(){
  const pool = $('#pool');
  pool.querySelectorAll('.tile').forEach(t=>{
    if(nameMode==='both') t.removeAttribute('data-names');
    else t.dataset.names = nameMode;
  });
  document.querySelectorAll('#namebar .seg button').forEach(b=>{
    b.setAttribute('aria-pressed', String(b.dataset.names===nameMode));
  });
  const classRound = S && S.kind==='class';
  $('#namebar').classList.toggle('no-names', !classRound);
  // one long name per row, or two short ones side by side
  if(classRound && nameMode!=='both') pool.dataset.cols = '2';
  else pool.removeAttribute('data-cols');
}

function buildInsulinRound(R, only){
  const board = $('#board');
  board.className = 'insulin-grid';
  board.innerHTML='';
  const pool = $('#pool');
  pool.className='pool values';
  pool.innerHTML='';

  const use = only ? R.items.filter(i=>only.has(i.id)) : R.items;
  const vals = [];

  use.forEach(ins=>{
    const c = document.createElement('div');
    c.className='icard';
    c.dataset.ins = ins.id;
    c.innerHTML =
      '<div class="ihead"><h3>'+ins.name+'</h3><span class="infodot" aria-hidden="true">i</span></div>'+
      '<div class="cls">'+ins.brand+' &middot; '+ins.cls+'</div>'+
      '<div class="slots">'+
        slotHTML(ins.id,'onset','Onset')+
        slotHTML(ins.id,'peak','Peak')+
      '</div>'+
      '<div class="dur" hidden><span>Duration</span><b>'+ins.dur+'</b></div>';
    board.appendChild(c);
    vals.push({v:ins.onset, ins:ins.id}, {v:ins.peak, ins:ins.id});
  });

  S.total = vals.length;
  shuffle(vals).forEach(v=>pool.appendChild(makeVTile(v.v)));
  $('#dock-title').textContent = 'Drag each time onto the right insulin';
  refreshDock();
}
function slotHTML(ins,kind,label){
  return '<div class="slot" tabindex="0" role="button" data-ins="'+ins+'" data-kind="'+kind+'" '+
         'aria-label="'+label+' for this insulin, empty">'+
         '<span class="lbl">'+label+'</span><span class="val">&mdash;</span></div>';
}
function makeVTile(v){
  const b=document.createElement('button');
  b.type='button';
  b.className='vtile';
  b.dataset.val=v;
  b.textContent=v;
  attachDrag(b);
  return b;
}

/* ============================================================
   PLACEMENT LOGIC
   ============================================================ */

function correctTarget(tile, target){
  if(S.kind==='class') return tile.dataset.bin === target.dataset.bin;
  const ins = INSULIN.items.find(i=>i.id===target.dataset.ins);
  if(!ins) return false;
  if(target.classList.contains('filled')) return false;
  return ins[target.dataset.kind] === tile.dataset.val;
}

function place(tile, target){
  if(S.kind==='class'){
    const drop = target.querySelector('.bindrop');
    const hint = drop.querySelector('.emptyhint');
    if(hint) hint.remove();
    tile.removeAttribute('data-names');
    tile.classList.remove('selected','lifted');
    tile.classList.add('placed','pop');
    tile.tabIndex = -1;
    tile.style.width='';
    drop.appendChild(tile);
    if(tile.dataset.fact){
      const f=document.createElement('div');
      f.className='fact';
      f.textContent=tile.dataset.fact;
      drop.appendChild(f);
    }
    const have = drop.querySelectorAll('.tile').length;
    const need = +target.dataset.need;
    const c = target.querySelector('[data-count]');
    if(showCounts) c.textContent = have+'/'+need;
    if(have===need) target.classList.add('solved');
  } else {
    target.classList.add('filled');
    target.querySelector('.val').textContent = tile.dataset.val;
    target.setAttribute('aria-label', target.querySelector('.lbl').textContent+' '+tile.dataset.val);
    tile.remove();
    const card = target.closest('.icard');
    if(card.querySelectorAll('.slot.filled').length===2){
      card.classList.add('solved');
      card.querySelector('.dur').hidden=false;
    }
  }
  S.placed++;
  updateStats();
  refreshDock();
  if(S.placed===S.total && !S.review) finish();
}

function missed(tile, target){
  S.misses++;
  const k = S.kind==='class' ? tile.dataset.g : tile.dataset.val;
  const rec = S.errors.get(k) || {n:0, label:k, right: S.kind==='class' ? tile.dataset.binName : ownerOf(tile.dataset.val), wrong:new Set()};
  rec.n++;
  rec.wrong.add(S.kind==='class' ? target.querySelector('.binname').textContent
                                 : target.closest('.icard').querySelector('.ihead h3').textContent+' '+target.dataset.kind);
  S.errors.set(k, rec);
  target.classList.add('rejecting');
  setTimeout(()=>target.classList.remove('rejecting'),320);
  if(rec.n >= 2) giveHint(tile);
  updateStats();
}

let hintTimer = null, hintTextTimer = null;
function clearHint(){
  clearTimeout(hintTimer); clearTimeout(hintTextTimer);
  document.querySelectorAll('#board .hinted').forEach(el=>el.classList.remove('hinted'));
  const bar = $('#hintbar'); bar.hidden = true; bar.textContent = '';
}
function giveHint(tile){
  clearHint();
  let boxes = [], msg = '';
  if(S.kind==='class'){
    const fam = (HINTFAM[S.key]||[]).find(f=>f.ids.includes(tile.dataset.bin));
    if(!fam) return;
    boxes = fam.ids.map(id=>document.querySelector('#board .bin[data-bin="'+id+'"]')).filter(Boolean);
    msg = 'Hint: '+tile.dataset.g+' is one of '+fam.n+'. Those boxes are outlined.';
  } else {
    const v = tile.dataset.val;
    boxes = [...document.querySelectorAll('#board .icard')].filter(c=>{
      const ins = INSULIN.items.find(i=>i.id===c.dataset.ins);
      return ins && (ins.onset===v || ins.peak===v);
    });
    msg = 'Hint: '+v+' belongs to '+(boxes.length>1 ? 'one of the outlined insulins.' : 'the outlined insulin.');
  }
  boxes.forEach(b=>b.classList.add('hinted'));
  const bar = $('#hintbar'); bar.textContent = msg; bar.hidden = false;
  hintTimer = setTimeout(()=>boxes.forEach(b=>b.classList.remove('hinted')), 3500);
  hintTextTimer = setTimeout(()=>{ bar.hidden = true; }, 7000);
}
function ownerOf(val){
  return INSULIN.items.filter(i=>i.onset===val||i.peak===val)
    .map(i=>i.name+' '+(i.onset===val?'onset':'peak')).join(' or ');
}

function updateStats(){
  $('#s-placed').textContent=S.placed;
  $('#s-miss').textContent=S.misses;
  $('#progbar').style.width = (S.total? (S.placed/S.total*100):0)+'%';
}
function refreshDock(){
  const left = $('#pool').children.length;
  $('#dock-count').textContent = left ? left+' left' : '';
}

/* ============================================================
   DRAG (pointer based, works on touch and mouse)
   ============================================================ */

let drag = null;
let scrollRAF = null;

function targetsSelector(){ return S.kind==='class' ? '.bin' : '.slot'; }

function attachDrag(el){
  el.addEventListener('pointerdown', onDown);
  el.addEventListener('contextmenu', e=>e.preventDefault());
  el.addEventListener('keydown', e=>{
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleSelect(el); }
  });
}

function toggleSelect(el){
  if(el.classList.contains('placed')) return;
  const cur = S.selected;
  if(cur) cur.classList.remove('selected');
  S.selected = (cur===el) ? null : el;
  if(S.selected) S.selected.classList.add('selected');
}

function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(_){} }
function liftOf(d){ return d.touch ? 52 : 0; }

/* On touch: hold to pick a tile up, swipe to scroll the word bank.
   On mouse: move a few pixels to pick up, wheel to scroll. */
function onDown(e){
  if(e.button!==undefined && e.button!==0) return;
  const el = e.currentTarget;
  if(el.classList.contains('placed')) return;
  const rect = el.getBoundingClientRect();
  drag = {
    el, mode:'idle', touch:(e.pointerType==='touch'),
    startX:e.clientX, startY:e.clientY,
    px:e.clientX, py:e.clientY, lastY:e.clientY, vel:0,
    home:{left:rect.left, top:rect.top, w:rect.width},
    offX:e.clientX-rect.left, offY:e.clientY-rect.top,
    ghost:null, over:null, holdTimer:null
  };
  if(drag.touch){
    drag.holdTimer = setTimeout(()=>{ if(drag && drag.mode==='idle') beginDrag(); }, 240);
  }
  document.addEventListener('pointermove', onMove, {passive:false});
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
}

function beginDrag(){
  clearTimeout(drag.holdTimer);
  drag.mode = 'drag';
  const g = drag.el.cloneNode(true);
  g.classList.add('ghost');
  g.classList.remove('selected');
  g.style.width = drag.home.w+'px';
  g.style.left = (drag.px-drag.offX)+'px';
  g.style.top  = (drag.py-drag.offY-liftOf(drag))+'px';
  document.body.appendChild(g);
  drag.ghost = g;
  drag.el.classList.add('lifted');
  if(S.selected){ S.selected.classList.remove('selected'); S.selected=null; }
  if(drag.touch) buzz(12);
  startAutoScroll();
}

function onMove(e){
  if(!drag) return;
  drag.px = e.clientX; drag.py = e.clientY;

  if(drag.mode==='idle'){
    const dist = Math.hypot(e.clientX-drag.startX, e.clientY-drag.startY);
    if(drag.touch){
      if(dist > 10){ clearTimeout(drag.holdTimer); drag.mode='scroll'; }
      else return;
    } else {
      if(dist < 6) return;
      beginDrag();
    }
  }

  if(e.cancelable) e.preventDefault();

  if(drag.mode==='scroll'){
    const d = drag.lastY - e.clientY;
    scrollBank(d);
    drag.vel = d;
    drag.lastY = e.clientY;
    return;
  }

  const lift = liftOf(drag);
  drag.ghost.style.left = (e.clientX-drag.offX)+'px';
  drag.ghost.style.top  = (e.clientY-drag.offY-lift)+'px';

  const hx = e.clientX, hy = e.clientY - lift;
  const under = document.elementFromPoint(hx, hy);
  const t = under && under.closest ? under.closest(targetsSelector()) : null;
  if(t !== drag.over){
    if(drag.over) drag.over.classList.remove('over');
    drag.over = (t && !(t.classList.contains('filled'))) ? t : null;
    if(drag.over) drag.over.classList.add('over');
  }
}

/* scroll the word bank first, hand the leftover to the page */
function scrollBank(d){
  const host = $('#pool');
  if(host.scrollHeight <= host.clientHeight + 2){ window.scrollBy(0, d); return; }
  const before = host.scrollTop;
  host.scrollTop += d;
  const applied = host.scrollTop - before;
  if(Math.abs(applied-d) > 0.5) window.scrollBy(0, d-applied);
}
function glide(v){
  let vel = v*1.15;
  const step = ()=>{
    if(drag || Math.abs(vel) < 0.6) return;
    scrollBank(vel);
    vel *= 0.93;
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function onUp(){
  document.removeEventListener('pointermove', onMove);
  document.removeEventListener('pointerup', onUp);
  document.removeEventListener('pointercancel', onUp);
  stopAutoScroll();
  if(!drag) return;
  const d = drag; drag = null;
  clearTimeout(d.holdTimer);

  if(d.mode==='idle'){ toggleSelect(d.el); return; }
  if(d.mode==='scroll'){ glide(d.vel); return; }

  if(d.over) d.over.classList.remove('over');
  const target = d.over;

  if(target && correctTarget(d.el, target)){
    d.ghost.remove();
    d.el.classList.remove('lifted');
    if(d.touch) buzz(14);
    place(d.el, target);
    return;
  }

  const flyHome = ()=>{
    const home = d.el.getBoundingClientRect();
    d.ghost.classList.add('returning');
    d.ghost.style.left = home.left+'px';
    d.ghost.style.top  = home.top+'px';
    d.ghost.style.transform = 'rotate(0deg) scale(1)';
    setTimeout(()=>{ d.ghost.remove(); d.el.classList.remove('lifted'); }, 270);
  };

  if(target){
    missed(d.el, target);
    if(d.touch) buzz([40,50,40]);
    d.ghost.classList.add('wrong');
    setTimeout(flyHome, 320);
  } else {
    setTimeout(flyHome, 30);
  }
}

function startAutoScroll(){
  const dockEl = $('#dock'), poolEl = $('#pool');
  const step = ()=>{
    if(!drag){ scrollRAF=null; return; }
    const x = drag.px, y = drag.py - liftOf(drag), h = window.innerHeight;
    const pr = poolEl.getBoundingClientRect();

    // inside the word bank: scroll the bank itself
    const bankScrolls = poolEl.scrollHeight > poolEl.clientHeight + 2;
    if(bankScrolls && x>=pr.left && x<=pr.right && y>=pr.top-6 && y<=pr.bottom+6){
      if(y < pr.top+44) poolEl.scrollTop -= 11;
      else if(y > pr.bottom-44) poolEl.scrollTop += 11;
      scrollRAF = requestAnimationFrame(step);
      return;
    }

    // over the board: scroll the page
    const docked = getComputedStyle(dockEl).position === 'fixed';
    const bottomEdge = docked ? h - dockEl.offsetHeight : h;
    const topEdge = ($('header').offsetHeight || 62) + 46;
    if(y < topEdge) window.scrollBy(0, -Math.ceil((topEdge-y)/6)-3);
    else if(y > bottomEdge-56) window.scrollBy(0, Math.ceil((y-(bottomEdge-56))/5)+2);
    scrollRAF = requestAnimationFrame(step);
  };
  if(!scrollRAF) scrollRAF = requestAnimationFrame(step);
}
function stopAutoScroll(){ if(scrollRAF){cancelAnimationFrame(scrollRAF); scrollRAF=null;} }

/* click-to-place fallback */
document.addEventListener('click', e=>{
  if(!S || !S.selected) return;
  const t = e.target.closest(targetsSelector());
  if(!t) return;
  if(S.kind==='insulin' && t.classList.contains('filled')) return;
  const tile = S.selected;
  if(correctTarget(tile,t)){ tile.classList.remove('selected'); S.selected=null; buzz(14); place(tile,t); }
  else{
    missed(tile,t);
    buzz([40,50,40]);
    tile.classList.add('selected');
  }
});

document.querySelectorAll('#namebar .seg button').forEach(b=>{
  b.addEventListener('click',()=>{ nameMode = b.dataset.names; applyNames(); });
});

$('#btn-controls').addEventListener('click',e=>{
  const hidden = $('#dock').classList.toggle('controls-hidden');
  e.currentTarget.setAttribute('aria-expanded', String(!hidden));
});

/* ============================================================
   RESULTS
   ============================================================ */

function finish(){
  S.done = true;
  clearInterval(tick);
  const ms = Date.now()-S.t0;
  const firstTry = S.total - S.errors.size;
  const acc = Math.round(firstTry/S.total*100);

  $('#sheet-title').textContent = S.R.title + ' complete';
  $('#sheet-sub').textContent = (firstTry===S.total
    ? 'Clean run. Every tile landed on the first try. '
    : firstTry+' of '+S.total+' landed on the first try. ')
    + 'Every box is now tappable for the full class breakdown.';
  $('#r-acc').textContent = acc+'%';
  $('#r-miss').textContent = S.misses;
  $('#r-time').textContent = fmt(ms);

  const body = $('#r-body');
  if(S.errors.size===0){
    body.innerHTML = '<div class="perfect">Nothing to re-drill. Move on to the next round or run this one again for speed.</div>';
    $('#r-drill').style.display='none';
  } else {
    $('#r-drill').style.display='';
    const ul=document.createElement('ul');
    ul.className='misslist';
    [...S.errors.values()].sort((a,b)=>b.n-a.n).forEach(r=>{
      const li=document.createElement('li');
      li.innerHTML='<b>'+r.label+'</b> belongs in <b>'+r.right+'</b><br><span>You tried: '+[...r.wrong].join(', ')+'</span>';
      ul.appendChild(li);
    });
    body.innerHTML='';
    body.appendChild(ul);
  }
  $('#r-keybox').hidden = true;
  $('#r-keybox').innerHTML = '';
  $('#r-next').style.display = nextRoundKey(S.key) ? '' : 'none';
  enableInfo();
  $('#overlay').hidden = false;
  $('#r-again').focus();
}

function buildKey(){
  const box = $('#r-keybox');
  let html = '<h3>Answer key</h3><dl>';
  if(S.kind==='class'){
    S.R.bins.forEach(b=>{
      html += '<dt>'+b.name+'</dt><dd>'+b.items.map(i=>i.g+(i.b?' ('+i.b+')':'')).join(' &middot; ')+'</dd>';
    });
  } else {
    INSULIN.items.forEach(i=>{
      html += '<dt>'+i.name+' ('+i.brand+')</dt><dd>Onset '+i.onset+' &middot; Peak '+i.peak+' &middot; Duration '+i.dur+'</dd>';
    });
  }
  box.innerHTML = html+'</dl>';
  box.hidden=false;
}

/* ============================================================
   REVIEW MODE AND CLASS CARDS
   ============================================================ */

let reviewMode = false;

/* drop every tile into its correct home, so the board reads as a study sheet */
function fillEverything(){
  const board = $('#board'), pool = $('#pool');
  if(S.kind==='class'){
    [...pool.querySelectorAll('.tile')].forEach(t=>{
      const bin = board.querySelector('.bin[data-bin="'+t.dataset.bin+'"]');
      if(bin) place(t, bin);
    });
  } else {
    board.querySelectorAll('.slot').forEach(sl=>{
      const ins = INSULIN.items.find(i=>i.id===sl.dataset.ins);
      if(!ins) return;
      const want = ins[sl.dataset.kind];
      const t = [...pool.querySelectorAll('.vtile')].find(v=>v.dataset.val===want);
      if(t) place(t, sl);
    });
  }
  refreshDock();
}

function enableInfo(){
  S.canInfo = true;
  document.querySelectorAll('#board .bin, #board .icard').forEach(el=>{
    el.classList.add('can-info');
    el.tabIndex = 0;
    el.setAttribute('role','button');
    const key = el.dataset.bin || el.dataset.ins;
    const card = INFO[key];
    if(card) el.setAttribute('aria-label', card.t+', open details');
  });
}

function openInfo(key){
  const c = INFO[key];
  if(!c) return;
  $('#info-title').textContent = c.t;
  let html = '';
  const sec = (h,b)=> b ? '<div class="isec"><h3>'+h+'</h3><p>'+b+'</p></div>' : '';
  const lst = (h,items)=> (items && items.length)
    ? '<div class="isec"><h3>'+h+'</h3><ul class="idiff">'+items.map(d=>'<li><b>'+d.n+'</b>'+d.d+'</li>').join('')+'</ul></div>' : '';
  if(c.sections){
    c.sections.forEach(s=>{ html += s.items ? lst(s.h, s.items) : sec(s.h, s.p); });
    if(c.list) html += lst(c.list.h, c.list.items);
  } else {
    html += sec('How it works', c.how);
    html += sec('What it treats', c.use);
    html += sec('Watch for', c.watch);
    html += sec('Nursing and teaching', c.nursing);
    html += lst('What sets the drugs apart', c.differs);
  }
  $('#info-body').innerHTML = html;
  $('#infolay').hidden = false;
  $('#infolay .sheet').scrollTop = 0;
  $('#info-close').focus();
}
function closeInfo(){ $('#infolay').hidden = true; }

document.addEventListener('click', e=>{
  if(!S || !S.canInfo || S.selected) return;
  if(!$('#infolay').hidden || !$('#overlay').hidden) return;
  const host = e.target.closest('#board .bin.can-info, #board .icard.can-info');
  if(!host) return;
  openInfo(host.dataset.bin || host.dataset.ins);
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter' || !S || !S.canInfo) return;
  const host = document.activeElement && document.activeElement.closest
    ? document.activeElement.closest('#board .bin.can-info, #board .icard.can-info') : null;
  if(host){ e.preventDefault(); openInfo(host.dataset.bin || host.dataset.ins); }
});
$('#info-close').addEventListener('click', closeInfo);
$('#infolay').addEventListener('click', e=>{ if(e.target.id==='infolay') closeInfo(); });

$('#btn-review').addEventListener('click', e=>{
  reviewMode = !reviewMode;
  e.currentTarget.setAttribute('aria-pressed', String(reviewMode));
  e.currentTarget.textContent = reviewMode ? 'Back to drill' : 'Review';
  document.body.classList.toggle('review', reviewMode);
  $('#overlay').hidden = true;
  closeInfo();
  startRound(S.key);
});

/* ============================================================
   CONTROLS
   ============================================================ */

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{ $('#overlay').hidden=true; startRound(t.dataset.round); });
});
$('#btn-restart').addEventListener('click',()=>{ $('#overlay').hidden=true; startRound(S.key); });
$('#btn-shuffle').addEventListener('click',()=>{
  const pool=$('#pool');
  shuffle([...pool.children]).forEach(c=>pool.appendChild(c));
  pool.scrollTop=0;
  applyNames();
});
$('#btn-counts').addEventListener('click',e=>{
  showCounts=!showCounts;
  e.currentTarget.setAttribute('aria-pressed',String(showCounts));
  e.currentTarget.textContent = showCounts?'Hide counts':'Show counts';
  document.querySelectorAll('.bin').forEach(b=>{
    const have=b.querySelectorAll('.bindrop .tile').length;
    b.querySelector('[data-count]').textContent = showCounts ? have+'/'+b.dataset.need : '';
  });
});
$('#r-again').addEventListener('click',()=>{ $('#overlay').hidden=true; startRound(S.key); });
function nextRoundKey(k){
  const i = ORDER.indexOf(k), nk = ORDER[i+1];
  return (nk && examOf(nk)===examOf(k)) ? nk : null;
}
$('#r-next').addEventListener('click',()=>{
  const nk = nextRoundKey(S.key);
  $('#overlay').hidden=true;
  if(nk) startRound(nk);
});
$('#btn-principles').addEventListener('click',()=>{
  if(S && S.R.principles) openInfo(S.R.principles);
});
$('#r-drill').addEventListener('click',()=>{
  const keys=[...S.errors.keys()];
  const only=new Set();
  if(S.kind==='class'){ keys.forEach(k=>only.add(k)); }
  else{
    INSULIN.items.forEach(i=>{ if(keys.includes(i.onset)||keys.includes(i.peak)) only.add(i.id); });
  }
  $('#overlay').hidden=true;
  startRound(S.key, only);
});
$('#r-key').addEventListener('click',buildKey);
$('#r-close').addEventListener('click',()=>{ $('#overlay').hidden=true; });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(!$('#infolay').hidden) closeInfo();
    else if(!$('#overlay').hidden) $('#overlay').hidden=true;
    else if(S && S.selected){ S.selected.classList.remove('selected'); S.selected=null; }
  }
});

/* keep layout in sync with header and dock heights */
const dock=$('#dock');
new ResizeObserver(()=>{
  document.documentElement.style.setProperty('--dock-h', dock.offsetHeight+'px');
}).observe(dock);
new ResizeObserver(()=>{
  document.documentElement.style.setProperty('--head-h', $('header').offsetHeight+'px');
}).observe($('header'));

startRound('endocrine');
</script>
