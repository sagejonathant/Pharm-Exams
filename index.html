<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drug Class Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#E7EBE8;
  --panel:#FFFFFF;
  --panel-2:#F3F6F4;
  --ink:#16262B;
  --muted:#6A797E;
  --line:#C9D3CF;
  --line-soft:#DDE4E1;
  --accent:#1F4380;
  --accent-soft:#E7ECF5;
  --ok:#11624A;
  --ok-bg:#E1EFE9;
  --ok-line:#9CC9B8;
  --bad:#AE2A1F;
  --bad-bg:#F9E4E1;
  --dock-h:210px;
  --head-h:62px;
  --radius:10px;
  font-synthesis-weight:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:40;
  background:var(--ground);
  border-bottom:1px solid var(--line);
}
.hrow{
  max-width:1180px;margin:0 auto;
  padding:10px 18px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.brand{
  font-family:'Instrument Serif',Georgia,serif;
  font-size:23px;letter-spacing:-.01em;line-height:1;
  margin-right:2px;white-space:nowrap;
}
.brand em{font-style:italic;color:var(--accent)}
.tabs{
  display:flex;align-items:center;gap:4px;background:var(--panel-2);padding:3px;border-radius:8px;border:1px solid var(--line-soft);
  max-width:100%;overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tabsep{flex:0 0 1px;align-self:stretch;margin:4px 3px;background:var(--line)}
.bonus-tag{
  display:inline-block;margin-left:6px;padding:0 5px;border-radius:4px;
  font-size:10.5px;font-weight:600;line-height:16px;vertical-align:1px;
  color:var(--muted);border:1px solid var(--line);letter-spacing:.01em;
}
.linkbtn{
  border:0;background:none;padding:0;margin-top:6px;
  font:inherit;font-size:13.5px;font-weight:600;color:var(--accent);
  cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;
  touch-action:manipulation;
}
.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.linkbtn[hidden]{display:none}
.tab{
  border:0;background:transparent;border-radius:6px;
  padding:6px 12px;font-size:13.5px;font-weight:500;color:var(--muted);
  cursor:pointer;white-space:nowrap;
}
.tab[aria-selected="true"]{background:var(--panel);color:var(--accent);box-shadow:0 1px 2px rgba(20,40,45,.10);font-weight:600}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.spacer{flex:1 1 auto}
.stats{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--muted)}
.stat b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.ghostbtn{
  border:1px solid var(--line);background:var(--panel);
  border-radius:7px;padding:6px 11px;font-size:13px;font-weight:500;
  cursor:pointer;
}
.ghostbtn:hover{border-color:var(--accent);color:var(--accent)}
.ghostbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.progwrap{height:3px;background:var(--line-soft)}
.progbar{height:100%;width:0;background:var(--accent);transition:width .35s cubic-bezier(.2,.7,.3,1)}

/* ---------- board ---------- */
main{
  max-width:1340px;margin:0 auto;padding:18px;
  display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start;
}
.boardcol{min-width:0}
.lede{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  margin:2px 0 16px;
}
.lede h1{
  font-family:'Instrument Serif',Georgia,serif;
  font-weight:400;font-size:30px;line-height:1.05;margin:0;letter-spacing:-.015em;
}
.lede p{margin:0;color:var(--muted);font-size:14px;max-width:56ch}

.board{
  display:grid;gap:12px;
  grid-template-columns:repeat(auto-fill,minmax(255px,1fr));
  align-items:start;
}
.bin{
  background:var(--panel);
  border:1px solid var(--line-soft);
  border-radius:var(--radius);
  padding:10px 11px 11px;
  min-height:96px;
  transition:border-color .12s,background .12s,box-shadow .12s;
}
.bin:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bin.over{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.bin.rejecting{animation:binbad .3s ease}
@keyframes binbad{0%,100%{border-color:var(--line-soft)}30%,70%{border-color:var(--bad);background:var(--bad-bg)}}
.bin.solved{background:var(--ok-bg);border-color:var(--ok-line)}
.binhead{
  display:flex;align-items:baseline;gap:8px;
  padding-bottom:8px;margin-bottom:8px;
  border-bottom:1px dashed var(--line);
}
.binname{font-weight:600;font-size:14px;letter-spacing:-.005em;line-height:1.25}
.bincount{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bindrop{
  display:flex;flex-direction:column;gap:6px;min-height:44px;
  justify-content:center;
}
.emptyhint{
  font-size:12.5px;color:#9AA8AC;text-align:center;padding:8px 4px;
  border:1px dashed var(--line);border-radius:7px;
}

/* ---------- tiles ---------- */
.tile{
  display:block;width:100%;text-align:left;
  background:var(--panel);
  border:1px solid var(--line);
  border-left:3px solid var(--accent);
  border-radius:8px;
  padding:7px 10px;
  cursor:grab;
  touch-action:none;
  user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  transition:box-shadow .12s,border-color .12s,transform .12s;
}
/* word-bank name display modes. Placed tiles lose the attribute and show everything. */
.tile[data-names="generic"] .b{display:none}
.tile[data-names="brand"] .g{display:none}
.tile[data-names="brand"] .b{
  font-size:14px;font-weight:600;color:var(--ink);margin-top:0;letter-spacing:-.005em;
}
.tile[data-names="brand"][data-nobrand] .g{display:block}
.tile .b .bonus-tag{display:none}
.tile[data-names="brand"] .b .bonus-tag{display:inline-block}
.tile:hover{box-shadow:0 2px 6px rgba(20,40,45,.11)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .g{display:block;font-weight:600;font-size:14px;line-height:1.25;letter-spacing:-.005em}
.tile .b{display:block;font-size:12px;color:var(--muted);line-height:1.3;margin-top:1px}
.tile.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),0 2px 8px rgba(20,40,45,.14)}
.tile.lifted{opacity:.28;pointer-events:none}
.tile.placed{
  cursor:default;background:var(--panel);
  border-left-color:var(--ok);border-color:var(--ok-line);
}
.tile.placed .g{color:var(--ok)}
.tile.pop{animation:pop .34s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.9)}55%{transform:scale(1.035)}100%{transform:scale(1)}}
.fact{
  font-size:12px;color:var(--muted);line-height:1.35;
  margin:4px 0 0 4px;padding-left:8px;border-left:2px solid var(--ok-line);
}

/* dragging ghost */
.ghost{
  position:fixed;z-index:999;pointer-events:none;
  box-shadow:0 10px 24px rgba(20,40,45,.26);
  transform:rotate(-1.1deg) scale(1.02);
  cursor:grabbing;
}
.ghost.wrong{
  border-color:var(--bad)!important;border-left-color:var(--bad)!important;
  background:var(--bad-bg)!important;
  animation:shake .3s ease;
}
.ghost.wrong .g{color:var(--bad)}
.ghost.wrong .b{color:var(--bad);opacity:.75}
@keyframes shake{
  0%,100%{transform:translateX(0) rotate(-1.1deg)}
  15%{transform:translateX(-9px) rotate(-3deg)}
  35%{transform:translateX(8px) rotate(2.5deg)}
  55%{transform:translateX(-6px) rotate(-2deg)}
  75%{transform:translateX(4px) rotate(1deg)}
}
.ghost.returning{transition:left .26s cubic-bezier(.4,0,.2,1),top .26s cubic-bezier(.4,0,.2,1),transform .26s}

/* ---------- insulin round ---------- */
.insulin-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.icard{
  background:var(--panel);border:1px solid var(--line-soft);
  border-radius:var(--radius);padding:12px 13px 13px;
}
.icard.solved{background:var(--ok-bg);border-color:var(--ok-line)}
.icard h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.005em}
.icard .cls{font-size:12px;color:var(--muted);margin:1px 0 10px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{
  border:1px dashed var(--line);border-radius:8px;padding:7px 9px;
  min-height:58px;display:flex;flex-direction:column;justify-content:center;
  background:var(--panel-2);
  transition:border-color .12s,background .12s;
}
.slot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.slot .lbl{font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.01em}
.slot .val{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:#A6B2B6;margin-top:2px}
.slot.filled{border-style:solid;border-color:var(--ok-line);background:var(--panel)}
.slot.filled .val{color:var(--ok)}
.slot.over{border-color:var(--accent);background:var(--accent-soft)}
.slot.rejecting{animation:binbad .3s ease}
.dur{margin-top:9px;font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:baseline}
.dur b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.vtile{
  display:inline-block;text-align:center;
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:8px;padding:9px 14px;cursor:grab;touch-action:none;
  font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums;
  user-select:none;-webkit-user-select:none;
  transition:box-shadow .12s,border-color .12s;
}
.vtile:hover{box-shadow:0 2px 6px rgba(20,40,45,.11)}
.vtile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vtile.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.vtile.lifted{opacity:.28;pointer-events:none}

/* ---------- dock ---------- */
.dock{
  position:sticky;top:calc(var(--head-h) + 14px);z-index:30;
  background:var(--panel);
  border:1px solid var(--line-soft);
  border-radius:var(--radius);
  display:flex;flex-direction:column;
  max-height:calc(100vh - var(--head-h) - 30px);
  overflow:hidden;
}
.hintbar{
  margin:0;padding:8px 12px;font-size:13px;font-weight:600;line-height:1.4;
  background:var(--accent-soft);color:var(--ink);border-bottom:1px dashed var(--line);
}
.hintbar[hidden]{display:none}
.bin.hinted,.icard.hinted{outline:2px dashed var(--accent);outline-offset:3px}
.dockhead{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 12px 9px;border-bottom:1px dashed var(--line);
}
.dockhead .t{font-size:13px;font-weight:600;line-height:1.3}
.dockhead .n{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pool{
  flex:1 1 auto;min-height:70px;
  overflow-y:auto;overscroll-behavior-y:auto;
  padding:10px 12px 12px;
  display:flex;flex-direction:column;gap:6px;
  scrollbar-width:thin;
}
/* one column when both names show, two when only one does */
.pool[data-cols="2"]{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
  align-content:start;
}
.pool .tile{width:100%;padding:6px 9px}
.pool .vtile{width:100%}
.namebar{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;border-bottom:1px dashed var(--line);
}
.namebar[hidden]{display:none}
.dock.controls-hidden .namebar{display:none}
.namebar.no-names .seg{display:none}
.nb-lbl{font-size:12.5px;color:var(--muted);flex:0 0 auto}
.ghostbtn.tiny{padding:4px 9px;font-size:12px;border-radius:6px}
.chev{display:inline-block;transition:transform .16s ease;margin-left:5px;font-size:10px;line-height:1}
[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.seg{
  display:flex;flex:1 1 auto;gap:2px;
  background:var(--panel-2);border:1px solid var(--line-soft);
  border-radius:7px;padding:2px;
}
.seg button{
  flex:1 1 0;border:0;background:transparent;border-radius:5px;
  padding:5px 4px;font-size:12.5px;font-weight:500;color:var(--muted);
  cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  white-space:nowrap;
}
.seg button[aria-pressed="true"]{
  background:var(--panel);color:var(--accent);font-weight:600;
  box-shadow:0 1px 2px rgba(20,40,45,.12);
}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pool:empty::after{
  content:'Word bank empty. Everything is placed.';
  color:var(--muted);font-size:13px;padding:6px 2px;line-height:1.4;
}

/* ---------- overlay ---------- */
/* ---------- tappable class info ---------- */
.infodot{
  display:none;margin-left:6px;flex:0 0 auto;
  width:19px;height:19px;border-radius:50%;
  border:1px solid var(--accent);color:var(--accent);
  font-size:11px;font-weight:700;font-style:italic;
  align-items:center;justify-content:center;
}
.bin.can-info .infodot,.icard.can-info .infodot{display:inline-flex}
.bin.can-info,.icard.can-info{cursor:pointer}
.bin.can-info:hover,.icard.can-info:hover{border-color:var(--accent)}
.bin.can-info:focus-visible,.icard.can-info:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ihead{display:flex;align-items:center;gap:6px}
.ihead h3{flex:1 1 auto}

.closex{
  position:absolute;top:14px;right:14px;
  width:34px;height:34px;border-radius:8px;
  border:1px solid var(--line);background:var(--panel);
  font-size:20px;line-height:1;cursor:pointer;color:var(--muted);
  touch-action:manipulation;
}
.closex:hover{border-color:var(--accent);color:var(--accent)}
.closex:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sheet.info h2{margin-right:44px;margin-bottom:16px}
.isec{margin:0 0 17px}
.isec h3{
  font-size:13px;font-weight:600;color:var(--accent);
  margin:0 0 5px;letter-spacing:-.005em;
}
.isec p{margin:0;font-size:14px;line-height:1.55;max-width:62ch}
.idiff{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.idiff li{
  font-size:13.5px;line-height:1.5;
  padding-left:11px;border-left:2px solid var(--line-soft);
}
.idiff b{font-weight:600;display:block;margin-bottom:1px}

/* ---------- review mode ---------- */
body.review .dock{display:none}
body.review main{grid-template-columns:minmax(0,1fr)}
body.review .stats,body.review #btn-counts,body.review #btn-restart{display:none}
body.review .progwrap{visibility:hidden}
#btn-review[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}

.overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(18,34,38,.5);
  display:flex;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(2px);
}
.overlay[hidden]{display:none}
.sheet{
  background:var(--panel);border-radius:14px;position:relative;
  max-width:560px;width:100%;max-height:86vh;overflow:auto;
  padding:24px 26px 22px;
  box-shadow:0 20px 60px rgba(10,25,30,.35);
}
.sheet h2{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:28px;margin:0 0 4px;letter-spacing:-.015em}
.sheet .sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.score{display:flex;gap:24px;flex-wrap:wrap;margin:0 0 18px;padding-bottom:18px;border-bottom:1px solid var(--line-soft)}
.score div{display:flex;flex-direction:column}
.score .k{font-size:12px;color:var(--muted)}
.score .v{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.misslist{margin:0 0 18px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.misslist li{
  font-size:13.5px;padding:8px 10px;border-radius:7px;
  background:var(--bad-bg);border-left:3px solid var(--bad);
}
.misslist li b{font-weight:600}
.misslist li span{color:var(--muted)}
.perfect{
  font-size:13.5px;padding:10px 12px;border-radius:7px;margin-bottom:18px;
  background:var(--ok-bg);border-left:3px solid var(--ok);
}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:1px solid var(--accent);background:var(--accent);color:#fff;
  border-radius:8px;padding:9px 15px;font-size:14px;font-weight:600;cursor:pointer;
}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn.sec{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn.sec:hover{border-color:var(--accent);color:var(--accent);filter:none}
.key{margin-top:18px;border-top:1px solid var(--line-soft);padding-top:14px}
.key h3{font-size:14px;margin:0 0 8px;font-weight:600}
.key dl{margin:0;font-size:13px}
.key dt{font-weight:600;margin-top:9px}
.key dd{margin:1px 0 0;color:var(--muted)}

.footnote{
  margin:22px 0 0;padding:0;
  font-size:12.5px;color:var(--muted);line-height:1.5;max-width:78ch;
}
.footnote b{color:var(--ink);font-weight:600}

/* ---------- touch ---------- */
@media (pointer:coarse){
  .tile{padding:11px 12px;min-height:50px;display:flex;flex-direction:column;justify-content:center}
  .pool .tile{padding:11px 12px}
  .vtile{padding:14px 16px;min-height:52px}
  .bin{padding:12px 12px 14px;min-height:104px}
  .bindrop{min-height:56px;gap:8px}
  .emptyhint{padding:14px 4px}
  .slot{min-height:70px;padding:9px 10px}
  .ghostbtn{padding:9px 13px;min-height:40px}
  .tab{padding:9px 14px}
  .seg button{padding:9px 4px;font-size:13px}
  .btn{min-height:46px;padding:12px 18px}
  .binhead{padding-bottom:10px;margin-bottom:10px}
  .board{gap:14px}
}
@media (hover:none){
  .tile:hover,.vtile:hover{box-shadow:none}
  .ghostbtn:hover{border-color:var(--line);color:inherit}
  .btn.sec:hover{border-color:var(--line);color:var(--ink)}
}
@media (max-width:900px){
  body{padding-bottom:calc(var(--dock-h) + 14px)}
  main{grid-template-columns:1fr}
  .dock{
    position:fixed;left:0;right:0;bottom:0;top:auto;z-index:50;
    border:0;border-top:1px solid var(--line);border-radius:0;
    box-shadow:0 -6px 20px rgba(20,40,45,.09);
    max-height:none;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .dockhead{
    width:100%;max-width:1180px;margin:0 auto;
    border-bottom:0;padding:8px 16px 4px;
  }
  .hintbar{width:100%;max-width:1180px;margin:0 auto;padding:6px 16px}
  .pool{
    width:100%;max-width:1180px;margin:0 auto;
    flex-direction:row;flex-wrap:wrap;align-content:flex-start;
    gap:7px;max-height:min(36vh,230px);padding:0 16px 12px;
    overscroll-behavior-y:contain;
  }
  .pool[data-cols="2"]{display:flex}
  .pool .tile{width:auto;flex:1 1 calc(50% - 4px);min-width:0;max-width:none}
  .pool .vtile{width:auto;flex:1 1 calc(50% - 4px)}
  .namebar{max-width:1180px;margin:0 auto;width:100%;padding:6px 16px 8px;border-bottom:0}
}
@media (max-width:640px){
  .hrow{padding:8px 12px;gap:9px}
  .brand{font-size:19px}
  main{padding:14px 12px}
  .lede h1{font-size:24px}
  .board{grid-template-columns:1fr}
  .insulin-grid{grid-template-columns:1fr}
  .pool{padding:0 12px 12px;max-height:min(34vh,210px)}
  .dockhead{padding:7px 12px 5px}
  .namebar{padding:6px 12px 8px}
  .pool .tile{flex:1 1 calc(50% - 4px)}
  .stats{font-size:12px;gap:11px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}

  watch:'Pancreatitis and hypersensitivity reactions.',
  nursing:'No significant drug interactions, which is unusual and worth remembering. Teach the patient to report persistent severe abdominal pain immediately.',
  differs:[
    {n:'Sitagliptin (Januvia)', d:'The one on your list.'},
    {n:'Glucose-dependent', d:'Because insulin is only released when glucose is already elevated, hypoglycemia risk is low when used alone. Same logic as the GLP-1 drugs.'}
  ]
},
amylin:{
  t:'Amylin analog',
  how:'Analog of amylin, a peptide hormone made in the pancreas alongside insulin. It reduces after-meal glucose by delaying gastric emptying and decreasing glucagon secretion, and it suppresses appetite.',
  use:'Used with insulin in both type 1 and type 2 diabetes. It is an add-on, never a replacement.',
  watch:'Hypoglycemia, mostly because of the insulin it is paired with. Nausea and injection site reactions.',
  nursing:'Subcutaneous injection before each meal, as a separate injection from the insulin. Do not mix them in one syringe.',
  differs:[
    {n:'Pramlintide (Symlin)', d:'The only drug in this class.'},
    {n:'Easy to confuse', d:'Amylin comes from the beta cells, same as insulin. Glucagon comes from the alpha cells and does the opposite.'}
  ]
},
glp1:{
  t:'GLP-1 receptor agonist',
  how:'Mimics the natural incretin hormone GLP-1. Six actions: increases glucose-dependent insulin secretion, suppresses glucagon release, slows gastric emptying, increases satiety, reduces appetite, promotes weight loss. These are not insulin.',
  use:'Type 2 diabetes, chronic weight management in obesity or overweight with weight-related conditions, and cardiovascular risk reduction in selected patients.',
  watch:'GI effects are most common and cluster during dose escalation: nausea, vomiting, diarrhea, constipation, abdominal pain, decreased appetite. They usually improve over several weeks. Serious effects are pancreatitis, gallbladder disease, acute kidney injury, and thyroid C-cell tumors, which carry a boxed warning. Contraindicated with a personal or family history of medullary thyroid carcinoma, MEN type 2, prior serious hypersensitivity, and pregnancy for weight-loss indications. Caution in severe gastroparesis, history of pancreatitis, and severe GI disease.',
  nursing:'Most are weekly subcutaneous injections, so rotate sites. Teach the patient to report persistent severe abdominal pain immediately, since that is the pancreatitis signal. Push fluids and report persistent vomiting or diarrhea, because the kidney injury shows up mostly in patients who got dehydrated. Slowed gastric emptying can change the absorption of other oral drugs. The insulin or sulfonylurea dose may need to come down to avoid hypoglycemia.',
  differs:[
    {n:'Semaglutide (Ozempic)', d:'Weekly SC for type 2 diabetes, and it reduces major cardiovascular events in patients with established cardiovascular disease.'},
    {n:'Semaglutide (Wegovy)', d:'Weekly SC, dosed above 1 mg, for chronic weight management.'},
    {n:'Semaglutide (Rybelsus)', d:'The oral form. Everything else in this class is injected.'},
    {n:'Exenatide (Byetta)', d:'The outlier on schedule: twice daily, within 60 minutes before the morning and evening meals.'},
    {n:'Low hypoglycemia risk', d:'Insulin is released only when blood glucose is elevated, so used alone these rarely cause hypoglycemia. They also cause weight loss, unlike insulin and sulfonylureas which cause weight gain.'}
  ]
},
dual:{
  t:'Dual GIP/GLP-1 agonist',
  how:'Activates both the GIP and the GLP-1 receptor. The actions are the same list as a GLP-1 agonist, but delivered through two incretin receptors instead of one.',
  use:'Type 2 diabetes (Mounjaro). Chronic weight management and moderate-to-severe obstructive sleep apnea in adults with obesity (Zepbound).',
  watch:'Same profile as the GLP-1 agonists, boxed warning for thyroid C-cell tumors included. Same contraindications: medullary thyroid carcinoma, MEN type 2, prior serious hypersensitivity.',
  nursing:'Weekly subcutaneous injection. Teaching is identical to the GLP-1 agonists: report severe abdominal pain, stay hydrated, expect GI effects to settle.',
  differs:[
    {n:'Tirzepatide (Mounjaro, Zepbound)', d:'The only dual agonist. Mounjaro is the diabetes label, Zepbound the weight and sleep apnea label.'},
    {n:'The exam question', d:'Your guide asks which are GLP-1 and which are GIP/GLP-1, and which produces the greater weight loss. Tirzepatide is the dual agonist and generally produces greater weight loss than semaglutide in trials.'}
  ]
},
thyroidrep:{
  t:'Thyroid hormone replacement',
  how:'Replaces the hormone a failing thyroid is not making. Thyroid hormone stimulates energy use by raising metabolic rate, stimulates the heart, and promotes growth of brain, nervous system, and skeletal muscle.',
  use:'Hypothyroidism. Most commonly from chronic autoimmune thyroiditis (Hashimoto thyroiditis), and also thyroidectomy, iodine deficiency, congenital failure, medications, irradiation, or pituitary failure.',
  watch:'Adverse effects are rare at appropriate doses. In overdose you see the signs of thyroid hormone excess: tachycardia, palpitations, nervousness, heat intolerance, weight loss, insomnia. With warfarin it increases the INR and the bleeding risk.',
  nursing:'Single oral dose in the morning on an empty stomach, and it is lifelong. Separate it from iron, calcium supplements, antacids, and some cholesterol-lowering drugs, all of which reduce absorption. Teach the patient not to stop when they start feeling better. If therapy is working, symptoms reverse and the TSH comes down.',
  differs:[
    {n:'Levothyroxine (Synthroid, Levothroid, Levoxyl)', d:'Synthetic T4 that the body converts to T3. The standard replacement and the one with the teaching points above.'},
    {n:'Liothyronine (Cytomel)', d:'This is T3. It acts faster than levothyroxine but has a shorter half-life and duration.'},
    {n:'Lab logic', d:'In primary hypothyroidism the TSH is high and T3 and T4 are low. Treatment brings the TSH down and the hormones up.'}
  ]
},
antithyroid:{
  t:'Antithyroid drug',
  how:'Inhibits thyroid hormone synthesis. PTU additionally blocks the conversion of T4 to T3 in the periphery.',
  use:'Hyperthyroidism, most often Graves disease. Also thyrotoxic crisis, levothyroxine overdose, and preparation for thyroid surgery or radiation.',
  watch:'Agranulocytosis, which is rare but the reason this class gets respect. Drug-induced hypothyroidism if the dose overshoots.',
  nursing:'Teach the patient to report sore throat, fever, or any sign of infection immediately, since that is how agranulocytosis announces itself. If the drug is working, T3 and T4 fall and the TSH rises back toward normal as the negative feedback lifts.',
  differs:[
    {n:'Propylthiouracil (PTU)', d:'Blocks synthesis and blocks T4 to T3 conversion. Preferred during pregnancy. Faster onset than methimazole.'},
    {n:'Methimazole (Tapazole)', d:'Longer half-life so it is dosed less frequently, but it crosses the placenta and its onset is slower. Agranulocytosis risk is similar to PTU.'},
    {n:'Propranolol', d:'Not an antithyroid drug. The beta blocker reduces the heart rate driven by hyperthyroidism and does not affect T3, T4, or TSH at all. It treats the symptom, not the disease.'}
  ]
},

/* ---- GI ---- */
anticholinergic:{
  t:'Anticholinergic',
  how:'Binds and blocks acetylcholine receptors, which blocks transmission of nauseating stimuli to the chemoreceptor trigger zone.',
  use:'Motion sickness, and nausea around surgery.',
  watch:'Contraindicated in glaucoma, because blocking acetylcholine increases intraocular pressure. The side effect set is the classic anticholinergic one: blurred vision and dry eyes, drowsiness and dizziness and confusion and hallucinations, dry mouth, rapid heart rate, constipation, urinary retention, and flushed skin that cannot sweat, which leads to overheating. All of it is more pronounced in the elderly.',
  nursing:'Scopolamine is a 72-hour transdermal patch releasing 1 mg. Remove the old patch before applying a new one, and wash your hands after handling it so you do not transfer it to your eyes. No driving. Sugar-free candy for dry mouth, and watch for constipation and inability to void.',
  differs:[
    {n:'Scopolamine (Transderm-Scop, Scopace)', d:'The only one on your list.'},
    {n:'Memory hook', d:'Cannot see, cannot pee, cannot spit, cannot poop.'}
  ]
},
antihistamine:{
  t:'Antihistamine (H1 blocker)',
  how:'Inhibits acetylcholine by binding H1 receptors, which prevents cholinergic stimulation in the vestibular and reticular areas. The vestibular area is the inner ear, responsible for balance, which is why this class owns motion sickness.',
  use:'Motion sickness first. Also nonproductive cough, allergy symptoms, and sedation.',
  watch:'Anticholinergic-style effects: drowsiness, dry mouth, constipation, urinary retention. More pronounced in the elderly.',
  nursing:'Give before travel rather than after the nausea starts. Warn about driving and hazardous tasks. Taken with alcohol these cause severe central nervous system depression. Teach position changes to avoid hypotension.',
  differs:[
    {n:'Hydroxyzine (Vistaril)', d:'Can be given PO or IM only, never IV. This is the single-fact question in the class.'},
    {n:'Dimenhydrinate (Dramamine) and meclizine (Antivert)', d:'The motion sickness and vertigo agents.'},
    {n:'Diphenhydramine (Benadryl)', d:'Doubles as an allergy drug and a sleep aid, which is why its sedation is heavier.'},
    {n:'Meclizine', d:'Appears in the lecture slides but not on your final med list, so treat it as bonus.'}
  ]
},
glucocorticoid:{
  t:'Glucocorticoid',
  how:'Reduces swelling around tumors that block the gut, brings an anti-inflammatory effect that reduces nausea, and increases endorphin synthesis, which improves mood and appetite.',
  use:'Emesis associated with chemotherapy.',
  watch:'With more than short-term use, the usual steroid concerns: hyperglycemia, immunosuppression and masked infection, GI irritation.',
  nursing:'Given IV for this purpose. Usually paired with a serotonin antagonist before chemo. Monitor blood glucose, especially in a diabetic patient.',
  differs:[
    {n:'Dexamethasone (Decadron)', d:'The one usually named for chemotherapy-induced nausea.'},
    {n:'Methylprednisolone (Solu-Medrol)', d:'Same indication and route in this context.'}
  ]
},
dopamine:{
  t:'Dopamine antagonist',
  how:'Blocks dopamine receptors in the chemoreceptor trigger zone so the CTZ cannot pass the nausea signal on to the vomiting center.',
  use:'Nausea and vomiting. Also used for psychotic disorders and intractable hiccups.',
  watch:'Moderate sedation, hypotension, and mild anticholinergic symptoms. Extrapyramidal side effects are the reason the IV route is not preferred.',
  nursing:'PO and IM routes are preferred. IV is common but not preferred, and when it is used it goes in as a slow push. Teach the patient to change positions slowly because of hypotension, and to avoid alcohol.',
  differs:[
    {n:'Prochlorperazine (Compazine)', d:'Standard antiemetic use.'},
    {n:'Promethazine (Phenergan)', d:'Same class, but it is highly irritating to tissue, which is why the slow IV push and route preference matter more here.'},
    {n:'Versus prokinetics', d:'Both block dopamine in the CTZ. The prokinetics add gastric motility, and they are the ones your slides tie to tardive dyskinesia.'}
  ]
},
prokinetic:{
  t:'Prokinetic',
  how:'Blocks dopamine receptors in the CTZ while sensitizing tissues to acetylcholine, which stimulates upper GI motility and enhances emptying of stomach contents. The exact mechanism is not clearly understood.',
  use:'Nausea and vomiting related to chemotherapy and radiation, anesthesia, and opioids. Also delayed gastric emptying, meaning gastroparesis.',
  watch:'Tardive dyskinesia with long-term use, and the movements may persist or become permanent even after the drug is stopped. Fatigue, headache, dry mouth, diarrhea. Contraindicated in Parkinson disease because it worsens symptoms, and in GI obstruction, hemorrhage, or perforation.',
  nursing:'Increase fluids and offer sour sugar-free candy for dry mouth. No driving. Watch for and report lip smacking, puckering, chewing movements, tongue protrusion, grimacing, eye blinking, writhing limb movements, and trunk swaying. Early recognition and a medication review is what limits the damage.',
  differs:[
    {n:'Metoclopramide (Reglan)', d:'The drug in this class, and the one your guide points at for tardive dyskinesia.'},
    {n:'Why the Parkinson contraindication', d:'Parkinson disease is already a dopamine-deficient state. Blocking dopamine further makes the movement symptoms worse.'}
  ]
},
serotonin:{
  t:'Serotonin antagonist',
  how:'Blocks serotonin receptors in the GI tract and in the chemoreceptor trigger zone, cutting the signal at both ends.',
  use:'Post-operative and chemotherapy-related nausea and vomiting.',
  watch:'QT prolongation, which can lead to dysrhythmias. Headache, dizziness, diarrhea.',
  nursing:'For chemotherapy, give 30 to 60 minutes before the infusion begins, since prevention works far better than rescue. Check baseline ECG and electrolytes in patients at risk for QT problems.',
  differs:[
    {n:'Ondansetron (Zofran)', d:'The one on your list, and the workhorse antiemetic on most units.'},
    {n:'Why it is first choice for chemo', d:'Chemotherapy triggers serotonin release from the gut directly, so this class targets the actual mechanism rather than a downstream one.'}
  ]
},
cannabinoid:{
  t:'Cannabinoid',
  how:'Suppresses activity in the chemoreceptor trigger zone and stimulates appetite.',
  use:'Nausea, vomiting, and appetite loss resulting from cancer treatment.',
  watch:'Contraindicated in patients with psychiatric disorders. Mood changes, drowsiness, dizziness, headaches, nightmares, confusion, incoordination, memory lapse, dry mouth, orthostatic hypotension or hypertension, and tachycardia.',
  nursing:'Screen for psychiatric history before the first dose. Teach slow position changes and no driving. Expect it to be used when other antiemetics have not worked and appetite is also a problem.',
  differs:[
    {n:'Dronabinol (Marinol)', d:'The only one on your list.'},
    {n:'The dual benefit', d:'It is the only antiemetic on the list whose appetite stimulation is a treatment goal rather than a side effect.'}
  ]
},
adsorbent:{
  t:'Antidiarrheal: adsorbent',
  how:'Decreases secretion in the GI tract and provides a protective coating that slows gastric motility.',
  use:'Milder cases of diarrhea.',
  watch:'Constipation, metallic taste, and bleeding with bismuth subsalicylate. These decrease absorption of digoxin, quinidine, and hypoglycemic drugs. With warfarin they increase bleeding time. They can produce methotrexate toxicity.',
  nursing:'Never give bismuth subsalicylate to a child or teenager with flu or chickenpox. Use adsorbents carefully in older patients and in anyone with decreased bleeding time, clotting disorders, recent bowel surgery, or confusion. Separate them from other oral drugs.',
  differs:[
    {n:'Bismuth subsalicylate (Pepto-Bismol)', d:'The salicylate is the problem. In a child or teen with a viral illness it carries a risk of Reye syndrome, the same reason aspirin is avoided in that group. It also darkens the stool and tongue, which alarms patients if you do not warn them.'},
    {n:'Cholestyramine (Questran)', d:'A bile acid binder. Its coating and binding action is also why it interferes with so many other drugs.'}
  ]
},
antimotility:{
  t:'Antidiarrheal: antimotility',
  how:'Opiate and opiate-related agents decrease bowel motility and reduce pain by relieving spasms. Slowing transit time gives the bowel more time to absorb water and electrolytes.',
  use:'More severe diarrhea.',
  watch:'Should not be used for more than 2 days or if fever is present. Can cause dependence. Drowsiness, dizziness, lethargy, nausea and vomiting, constipation, respiratory depression, hypotension, urinary retention, flushing.',
  nursing:'Track the number of loose stools, since decreasing frequency is how you know it is working. Assess fluid volume status, intake and output, and mucous membranes before, during, and after treatment. Teach the patient to take it exactly as prescribed, watch fluid intake, and notify the prescriber immediately if symptoms persist. No driving.',
  differs:[
    {n:'Diphenoxylate with atropine (Lomotil)', d:'The atropine is a subtherapeutic dose added to deter abuse. Take more than directed and you get unpleasant anticholinergic effects before any opioid effect. That atropine also makes it contraindicated in glaucoma.'},
    {n:'Loperamide (Imodium)', d:'The over-the-counter option, without the atropine.'},
    {n:'Why the fever rule', d:'Slowing transit in an infectious process keeps the organism in the gut longer, so a fever changes the calculation.'}
  ]
},
probiotic:{
  t:'Probiotic',
  how:'Also called intestinal flora modifiers or bacterial replacement drugs. They restore the normal bacterial population of the gut.',
  use:'Antibiotic-induced diarrhea.',
  watch:'Generally well tolerated. Caution in severely immunocompromised patients.',
  nursing:'Separate the dose from the antibiotic so the antibiotic does not simply kill it. Follow product storage instructions, since many require refrigeration.',
  differs:[
    {n:'L. acidophilus', d:'The one on your list.'},
    {n:'Different logic from the others', d:'Every other antidiarrheal slows the gut down. This one replaces what the antibiotic destroyed.'}
  ]
},
osmotic:{
  t:'Osmotic laxative',
  how:'Hyperosmolar agents that pull water into the colon and increase the water in the feces. That increases bulk, the bowel distends, and peristalsis and the urge to evacuate follow.',
  use:'Constipation, and bowel preparation before procedures.',
  watch:'Fluid and electrolyte imbalances, hypotension, weakness, abdominal bloating, cramping, diarrhea, increased thirst.',
  nursing:'Assess fluid and electrolyte status before starting. Teach the patient to report severe abdominal pain, muscle weakness, cramps, or dizziness, all of which point at fluid or electrolyte loss.',
  differs:[
    {n:'Lactulose (Chronulac)', d:'Also used to decrease serum ammonia levels in hepatic encephalopathy. That second use is the crossover item most likely to show up.'},
    {n:'Polyethylene glycol (GoLYTELY)', d:'The high-volume bowel prep.'}
  ]
},
stimulant:{
  t:'Stimulant laxative',
  how:'Increases peristalsis by irritating sensory nerve endings in the intestinal mucosa.',
  use:'Constipation.',
  watch:'Abdominal cramps, weakness, diarrhea, nutrient malabsorption, electrolyte imbalances. Senna turns urine reddish brown.',
  nursing:'Works in 6 to 12 hours orally and 15 to 60 minutes rectally, so time the dose around the patient. Tablets are swallowed whole with 6 to 8 oz of water, never crushed or chewed, especially if enteric coated. Long-term use leads to decreased bowel tone and dependency.',
  differs:[
    {n:'Bisacodyl (Dulcolax)', d:'Give with water, not milk, antacids, or juice. Those raise gastric pH and dissolve the enteric coating early, which causes cramping and wastes the dose.'},
    {n:'Senna (Senokot)', d:'Discolors urine reddish brown. Warn the patient so they are not frightened by it.'}
  ]
},
bulk:{
  t:'Bulk-forming laxative',
  how:'Absorbs water into the intestines, increasing bulk and peristalsis. Closest thing to a natural high-fiber stool, which is why it is the safest class for long-term use.',
  use:'Constipation. Results in 8 to 12 hours.',
  watch:'Impaction, esophageal blockage, fluid disturbances, and electrolyte imbalances, all of which come from not taking enough water with it. Abdominal cramps.',
  nursing:'Mix in a glass of water or juice, stir and drink immediately because it gels fast, then follow with a full glass of water. At least 8 oz per the manufacturer. When a patient increases dietary fiber, fluid must increase too, or you produce the exact problem you were treating.',
  differs:[
    {n:'Psyllium (Metamucil) and methylcellulose (Citrucel)', d:'Behave the same way and carry the same fluid requirement.'}
  ]
},
emollient:{
  t:'Emollient (stool softener)',
  how:'Facilitates the mixture of stool fat and water, emulsifying and lubricating the feces so they pass more easily.',
  use:'Prevent constipation and decrease straining during defecation. Specifically used to reduce straining after surgery or myocardial infarction.',
  watch:'Abdominal cramping, diarrhea, electrolyte disorders, and decreased absorption of vitamins.',
  nursing:'This is prevention, not rescue. It will not relieve an impaction. Give with plenty of fluid.',
  differs:[
    {n:'Docusate sodium (Colace)', d:'The softener alone.'},
    {n:'Docusate with senna (PeriColace)', d:'Adds a stimulant to the softener.'},
    {n:'Why after an MI', d:'Straining triggers the Valsalva maneuver, which stresses a recovering heart.'}
  ]
},
antacid:{
  t:'Antacid',
  how:'They do not prevent the overproduction of acid. They neutralize acid that has already been secreted, and they stimulate secretion of mucus, the protective barrier, and bicarbonate, which buffers the acid. Raising gastric pH by about 1 point neutralizes 90 percent of gastric acid.',
  use:'Acute relief of symptoms associated with peptic ulcer, gastritis, and heartburn.',
  watch:'Overuse causes metabolic alkalosis. Contraindicated in known allergy, severe renal failure or electrolyte disturbance because the antacid electrolytes accumulate, and GI obstruction because antacids may stimulate motility when an obstruction needs surgery.',
  nursing:'Most other medications should be given 1 to 2 hours after an antacid. The reason is chelation, the chemical binding and inactivation of another drug into insoluble complexes, which reduces absorption. Antacids also change stomach pH, which affects absorption of drugs that need acid, and urinary pH, which affects excretion. Chew chewable tablets thoroughly and shake liquids well. Long-term self-medication can mask malignancy or a bleeding ulcer.',
  differs:[
    {n:'Aluminum salts (Basaljel, Maalox)', d:'Constipating. Often recommended for patients with renal disease because aluminum is more easily excreted.'},
    {n:'Magnesium (Milk of Magnesia)', d:'Causes diarrhea, which is exactly why it is combined with aluminum and calcium: the bowel effects cancel out and magnesium adds neutralizing capacity. Dangerous in renal failure, since the failing kidney cannot excrete it. Note that at higher doses this same drug is a saline laxative.'},
    {n:'Calcium carbonate (Tums)', d:'Constipation, kidney stones, and gas, so it is often combined with simethicone. Long duration of action can cause rebound hyperacidity. Also marketed as a dietary calcium source. Not recommended in renal disease.'},
    {n:'Sodium bicarbonate (Alka-Seltzer)', d:'Highly soluble with quick onset and short duration. The sodium content is the problem in heart failure, hypertension, or renal insufficiency.'}
  ]
},
antiflatulent:{
  t:'Antiflatulent',
  how:'Alters gas bubble surface tension, which makes the bubbles coalesce and disperse so the gas can leave the GI tract as flatulence or belching.',
  use:'The painful symptoms associated with gas.',
  watch:'Minimal adverse effects.',
  nursing:'Frequently added to antacid combination products, especially calcium carbonate, since calcium carbonate itself produces gas.',
  differs:[
    {n:'Simethicone', d:'The only one on your list. It does not absorb or neutralize anything, it just changes the physics of the bubbles.'}
  ]
},
h2:{
  t:'H2 receptor antagonist',
  how:'Competitively blocks the H2 receptor on acid-producing parietal cells. That reduces hydrogen ion secretion, raises the pH of the stomach, and relieves hyperacidity symptoms. It blocks one stimulus pathway, not the pump itself.',
  use:'GERD, peptic ulcer disease, erosive esophagitis, adjunct therapy to control upper GI bleeding, and stress ulcer prophylaxis in ICU patients.',
  watch:'Very few adverse effects overall. In elderly patients, central nervous system effects including confusion and disorientation. Thrombocytopenia has been reported with famotidine, along with anaphylaxis.',
  nursing:'For best results take the H2 blocker 1 to 2 hours before an antacid. Smoking decreases their effectiveness. Assess for allergies and impaired renal function, and use caution in patients who are confused, disoriented, or older.',
  differs:[
    {n:'Cimetidine (Tagamet)', d:'Largely replaced by famotidine because of its potential to cause drug interactions. It is still used in patients who are not taking multiple medications.'},
    {n:'Famotidine (Pepcid)', d:'The safer option, and the default choice when a patient is on several drugs.'},
    {n:'Versus PPIs', d:'H2 blockers are competitive and reversible, and they only cover the histamine pathway. Gastrin and acetylcholine can still drive acid production.'}
  ]
},
ppi:{
  t:'Proton pump inhibitor',
  how:'Parietal cells release hydrogen ions during acid production through what is called the proton pump. These drugs irreversibly bind the H+/K+ ATPase enzyme, preventing hydrogen ions from moving from the parietal cell into the stomach.',
  use:'GERD, erosive esophagitis, short-term treatment of active duodenal and benign gastric ulcers, NSAID-induced ulcers, stress ulcer prophylaxis, and H. pylori-induced ulcers when given with an antibiotic for 10 to 14 days.',
  watch:'Generally well tolerated. Possible predisposition to GI tract infections, particularly Clostridium difficile. Osteoporosis and fracture risk in long-term users. Pneumonia. Depletion of magnesium.',
  nursing:'Food decreases absorption, so take on an empty stomach. They increase serum levels of diazepam and phenytoin, can increase digoxin levels, raise INR and bleeding risk with warfarin, and can reduce the effectiveness of clopidogrel. Sucralfate may delay their absorption, so separate the two. Assess for liver disease.',
  differs:[
    {n:'The suffix', d:'All end in -prazole. Omeprazole (Prilosec) and pantoprazole (Protonix) are on your list; lansoprazole, rabeprazole, esomeprazole, and dexlansoprazole are the others.'},
    {n:'How the mechanism differs from everything else', d:'Antacids neutralize acid after it is secreted. H2 blockers reversibly block one of several stimulus pathways at the receptor. PPIs block the final common step, the pump itself, irreversibly. No matter which stimulus arrives, the hydrogen ion cannot leave the cell. That is why acid suppression is more complete and longer lasting.'}
  ]
},
pepsin:{
  t:'Pepsin inhibitor (mucosal protectant)',
  how:'Combines with proteins to form a thick paste that covers the ulcer, protecting it from acid and pepsin. Think of it as a liquid bandage over the crater.',
  use:'Peptic ulcer disease. Peptic ulcers involve digestion of the GI mucosa by the enzyme pepsin, and predisposing factors are H. pylori infection, long-term NSAIDs, long-term steroids, and NG tubes.',
  watch:'Constipation.',
  nursing:'Give 30 minutes before meals and at bedtime, so the coating is in place before food and acid arrive. It delays the absorption of PPIs and other drugs, so space the doses.',
  differs:[
    {n:'Sucralfate (Carafate)', d:'The only drug in the class.'},
    {n:'Different from every other acid drug', d:'It does nothing to the acid. It protects the tissue instead, which is why it is a mucosal protectant rather than an acid controller.'}
  ]
},

/* ---- individual insulins, for the timing round ---- */
lispro:{
  t:'Lispro (Humalog)',
  how:'Rapid-acting human insulin analog. Activates glucose transporters so glucose moves into the cell.',
  use:'Mealtime coverage and correction doses.',
  watch:'Onset 15-30 min, peak 0.5-2.5 hr, duration 3-6 hr. Hypoglycemia risk is highest at the peak, which is within the first couple of hours after the meal.',
  nursing:'The most flexible of the rapid analogs: it can be given right before or even just after a meal. Food still has to be available.',
  differs:[{n:'Against the other rapids', d:'Its peak window is the widest, 0.5 to 2.5 hr, and its duration is the longest at 3 to 6 hr.'}]
},
aspart:{
  t:'Aspart (NovoLog)',
  how:'Rapid-acting human insulin analog.',
  use:'Mealtime coverage and correction doses.',
  watch:'Onset 10-20 min, peak 1-5 hr, duration 3-5 hr.',
  nursing:'Give 5 to 10 minutes before the meal. Confirm the tray is there first.',
  differs:[{n:'Watch this one', d:'Its peak of 1-5 hr is identical to regular insulin, which is the one overlap in the whole timing table.'}]
},
glulisine:{
  t:'Glulisine (Apidra)',
  how:'Rapid-acting human insulin analog.',
  use:'Mealtime coverage and correction doses.',
  watch:'Onset 10-15 min, peak 1-1.5 hr, duration 3-5 hr.',
  nursing:'Give 15 minutes before eating.',
  differs:[{n:'Fastest on, tightest peak', d:'Onset of 10-15 min and the narrowest peak window of the three rapids at 1-1.5 hr.'}]
},
regular:{
  t:'Regular insulin (Humulin R, Novolin R)',
  how:'Insulin that resembles natural human insulin, not a modified analog.',
  use:'Mealtime coverage, and the insulin used IV in DKA and hyperkalemia.',
  watch:'Onset 30 min to 1 hr, peak 1-5 hr, duration 6-10 hr. The longer duration widens the hypoglycemia window compared with a rapid analog.',
  nursing:'Must be given 30 to 60 minutes before a meal. It is the only insulin that can be safely given IV, and it mixes with NPH.',
  differs:[{n:'The IV rule', d:'If a scenario involves an insulin drip or DKA, this is the insulin. No other insulin on the list goes IV.'}]
},
nph:{
  t:'NPH insulin (Humulin N, Novolin N)',
  how:'Regular insulin linked to protamine, a large protein that slows absorption and stretches out the action.',
  use:'Background coverage, usually twice daily.',
  watch:'Onset 1-2 hr, peak 6-14 hr, duration 16-24 hr. A morning dose peaks in the late afternoon or overnight, which is where the hypoglycemia shows up. Allergic reaction to the foreign protamine protein.',
  nursing:'The only cloudy insulin. Roll gently, never shake. The only one that can be mixed with short-acting insulins, and you draw clear before cloudy. SC only.',
  differs:[{n:'Longest peak window', d:'6 to 14 hours is by far the widest peak in the table, which is exactly why the timing matters for patient teaching.'}]
},
glargine:{
  t:'Insulin glargine (Lantus)',
  how:'Modified human insulin made by recombinant DNA technology that releases at a flat, steady rate.',
  use:'Basal coverage once daily. The long-acting component of a tight-control four-shot regimen.',
  watch:'Onset 70 min, duration 24 hr, and no distinct peak. Lower hypoglycemia risk than peaking insulins, but not zero.',
  nursing:'SC only. Never mix it with another insulin and never give it IV. Same time every day.',

/* ============================================================
   EXAM 2: ANTI-INFECTIVES
   Built from the Exam 2 study guide (9/24/26) and the lecture
   slides. Cards follow the guide's own study questions. The guide
   says specific diseases and gram coverage are not tested except
   MRSA, C. diff, Pseudomonas, and Candida/thrush, so organism
   lists are trimmed to those. Anything not in the slides is
   labeled "not in your slides".
   ============================================================ */

abx_principles:{
  t:'Exam 2 study guide: things to know',
  sections:[
    {h:'The four diseases your guide says to know', items:[
      {n:'MRSA', d:'Vancomycin, ceftaroline (the only cephalosporin that covers it), and TMP-SMZ for community-acquired MRSA. MRSA developed when Staph aureus changed its penicillin-binding protein so methicillin could not attach.'},
      {n:'C. difficile', d:'Highest risk with clindamycin and the fluoroquinolones, and any broad-spectrum course can cause it as a superinfection. Treated with metronidazole or oral vancomycin.'},
      {n:'Pseudomonas', d:'Piperacillin-tazobactam (the only antipseudomonal penicillin), cefepime (4th generation cephalosporin), and the aminoglycosides.'},
      {n:'Candida and thrush', d:'Nystatin swish and swallow for thrush. Fluconazole for Candida infections. Candida is also a classic superinfection after antibiotics.'}
    ]},
    {h:'When to take a culture', p:'Before the first antibiotic dose. Culture the wound, blood, urine, or other site first, then start broad-spectrum coverage, then check the culture and sensitivity, then switch to a narrow-spectrum drug. Giving the antibiotic first can kill enough bacteria to make the culture unreliable (the reason is not in your slides).'},
    {h:'Reading a culture and sensitivity report', p:'The culture identifies the organism. The sensitivity section lists antibiotics tested against it and shows which ones the organism is sensitive to and which it is resistant to. Sensitive means the drug will work; resistant means it will not, no matter the dose. Choose a drug the organism is sensitive to, and prefer the narrowest one that works. Reports usually mark each drug S (susceptible), I (intermediate), or R (resistant); those letters are not in your slides but are how real reports read.'},
    {h:'Mild vs severe allergic reaction', p:'Mild: rash, pruritus, hives. Severe: anaphylactic shock, which looks like throat or tongue swelling, wheezing, difficulty breathing, hypotension, and tachycardia (the specific signs are not in your slides). If you suspect anaphylaxis, stop the drug or infusion immediately and get help, then expect an antihistamine such as diphenhydramine, epinephrine, and a bronchodilator such as albuterol. When a patient reports an allergy, ask what actually happened, since nausea is a side effect and hives or swelling is an allergy.'},
    {h:'Antibiotics and antacids', p:'Do not take them at the same time. Antacids bind several antibiotics and block absorption, so separate them by about 2 hours. This applies to azithromycin, tetracycline, the fluoroquinolones, and sulfonamides. Tetracycline also cannot be taken with milk products.'},
    {h:'Red man syndrome (vancomycin flushing syndrome)', p:'Red blotching of the face, neck, chest, and extremities, with hypotension and tachycardia when severe. It comes from infusing vancomycin too fast and is not an allergy. Prevent it by infusing over 1 to 2 hours. If it starts, slow or stop the infusion and notify the provider.'},
    {h:'Peak and trough levels', p:'Drawn for vancomycin and the aminoglycosides, which have narrow therapeutic ranges. The trough is the lowest level, drawn right before the next dose (within 30 minutes). The peak is the highest level, drawn 1 hour after the infusion finishes. Interpreting them (not in your slides): a high trough means the drug is not clearing and is building up, so toxicity is likely and the dose is decreased or spaced further apart; a high peak also points to toxicity and a lower dose. A low peak means the drug never reaches an effective level, so the dose is increased. Hold the dose and call the provider when a trough comes back high.'},
    {h:'Disulfiram-like reaction', p:'A reaction that happens when alcohol is taken with a cephalosporin or with metronidazole. The drug interferes with alcohol breakdown, so a toxic byproduct builds up (mechanism not in your slides). Symptoms from your slides: flushing, dizziness, headache, nausea, vomiting, and muscle cramps with cephalosporins; flushing, palpitations, tachycardia, nausea, and vomiting with metronidazole. Avoid it by drinking no alcohol during therapy, and for 3 days after the last dose of metronidazole. Hidden alcohol in mouthwash and cough syrup counts too (not in your slides).'},
    {h:'Children under 8', p:'Tetracycline. It permanently discolors the developing teeth. If a young child is prescribed tetracycline, hold it and contact the provider.'},
    {h:'QT prolongation', p:'Macrolides and fluoroquinolones (and ondansetron from Exam 1). Cardiac disease, especially an existing dysrhythmia or prolonged QT, is the disease process that makes these a concern. Monitor with EKG or cardiac monitoring in cardiac patients. Watching potassium and magnesium and asking about palpitations, dizziness, or fainting are standard practice but not in your slides.'},
    {h:'General adverse effects of antifungals', p:'Hepatotoxicity and nephrotoxicity. Monitor liver enzymes, BUN, creatinine, electrolytes, and vital signs, and culture to identify the fungus. Teach full adherence, since stopping early can cause relapse. Azoles add nausea, vomiting, and rash; amphotericin B has the longest list, including fever and chills during the infusion and hypokalemia.'},
    {h:'Is the antibiotic working, and what is leukocytosis', p:'Leukocytosis is an elevated white blood cell count, a sign of infection. The antibiotic is working when the fever comes down, the WBC returns to normal, and the signs of infection improve. Poor response suggests the wrong drug or resistance.'},
    {h:'Antibiotic resistance', p:'Bacteria change so a drug no longer works on them. It is driven by overuse and by incomplete courses, which expose bacteria to the drug without killing them all. Teach the patient to finish the full course, never skip doses, and understand antibiotics do not treat viral or fungal illness. Examples: MRSA, VRE, VRSA.'},
    {h:'Superinfection', p:'A new infection that develops because the antibiotic killed the normal flora that kept other organisms in check. Examples: C. difficile and Candida (thrush, vaginal yeast infection). Sites are the mouth, skin, vagina, and intestines. More likely with longer courses and broader drugs.'},
    {h:'Broad vs narrow spectrum, and empiric therapy', p:'Broad spectrum covers many types of bacteria and is used when the organism is not yet known. Starting a broad-spectrum drug right after cultures are drawn, before results come back, is empiric therapy. Narrow spectrum targets one or a few organisms and is used once the culture and sensitivity identifies the cause. Broader coverage means more adverse effects and a higher chance of superinfection.'},
    {h:'The beta-lactam ring', p:'Penicillins and cephalosporins both contain it. The ring stops bacteria from building their cell wall, so they burst, which makes these drugs bactericidal (the ring binds the penicillin-binding proteins that build the wall, a detail not in your slides). Some bacteria make beta-lactamase, an enzyme that breaks the ring; that is why beta-lactamase inhibitors like clavulanic acid, sulbactam, and tazobactam are added. Because the ring is shared, allergies cross over: a patient with a history of anaphylaxis to a penicillin should avoid cephalosporins.'},
    {h:'Cephalosporins by generation', p:'1st: cephalexin (Keflex), cefadroxil (Duricef), cefazolin (Ancef). 2nd: cefotetan (Cefotan), cefoxitin (Mefoxin). 3rd: ceftriaxone (Rocephin). 4th: cefepime (Maxipime). 5th: ceftaroline (Teflaro). Coverage broadens as the generation rises, but your guide does not test gram coverage, so the drug-to-generation match is what matters.'},
    {h:'Bactericidal vs bacteriostatic', p:'Bactericidal drugs kill bacteria: penicillins, cephalosporins, vancomycin, aminoglycosides, fluoroquinolones. Bacteriostatic drugs stop growth without killing, leaving the immune system to finish the job: tetracycline and sulfonamides. Macrolides and clindamycin can be either, depending on the dose.'},
    {h:'Taking oral nystatin', p:'Swish and swallow, and gargle if the throat is involved. Holding it in the mouth and swishing as long as possible before swallowing gives the most contact with the thrush (not in your slides).'},
    {h:'Stevens-Johnson syndrome', p:'On your list with vancomycin and TMP-SMZ. Signs (not in your slides): starts with fever and flu-like symptoms, then a painful red or purple rash that spreads and blisters, peeling skin, and sores on the mucous membranes of the mouth, eyes, and genitals. It is an emergency: stop the drug and notify the provider.'},
    {h:'Nephrotoxicity and ototoxicity', p:'Nephrotoxicity (kidney damage): decreased urine output, rising BUN and creatinine, and swelling or weight gain from fluid retention. Ototoxicity (ear damage): tinnitus, hearing loss, dizziness or vertigo, and loss of balance. Your slides name tinnitus; the other signs are not in your slides. Drugs on your list: aminoglycosides, vancomycin, and amphotericin B for both; macrolides for ototoxicity; sulfonamides for renal impairment.'},
    {h:'Esophagitis', p:'Inflammation and irritation of the lining of the esophagus, felt as painful swallowing or chest pain. Tetracycline causes it. Prevent it by taking the dose with a full glass of water, staying upright afterward, and not taking it right before lying down (the definition and prevention steps are not in your slides).'},
    {h:'Shared traps across classes', items:[
      {n:'QT prolongation', d:'Macrolides and fluoroquinolones.'},
      {n:'Ototoxicity', d:'Aminoglycosides, vancomycin, macrolides, amphotericin B.'},
      {n:'Nephrotoxicity', d:'Aminoglycosides, vancomycin, amphotericin B, and renal impairment with sulfonamides.'},
      {n:'Photosensitivity', d:'Tetracycline, fluoroquinolones, sulfonamides, and per your slides, aminoglycosides.'},
      {n:'Disulfiram-like reaction', d:'Cephalosporins and metronidazole.'},
      {n:'Oral contraceptive failure', d:'Penicillins, cephalosporins, tetracycline. Teach backup contraception.'},
      {n:'Peak and trough', d:'Vancomycin and aminoglycosides.'},
      {n:'P-450 interactions', d:'Macrolides and azole antifungals.'},
      {n:'Stevens-Johnson syndrome', d:'Vancomycin and TMP-SMZ.'}
    ]}
  ]
},

function pcnBase(){
  return {
    sfx:'-cillin.',
    how:'Penicillins contain a beta-lactam ring, which stops bacteria from building their cell wall so they burst. Bactericidal. To a patient: this breaks down the wall that holds the bacteria together.',
    contra:'Penicillin allergy. Because penicillins and cephalosporins share the beta-lactam ring, a patient with a history of anaphylaxis to a penicillin should avoid cephalosporins.',
    ae:'Allergic reactions: mild is rash, pruritus, and hives; severe is anaphylaxis. Superinfection such as C. difficile or Candida.',
    admin:'Take an allergy history and ask what the reaction was. Draw cultures before the first dose. Monitor closely during the first dose and know the anaphylaxis response. Teach the patient to finish the full course.',
    inter:'May make oral contraceptives ineffective, so teach backup contraception.',
    mon:'Signs of allergic reaction after each dose. Signs the infection is improving: falling fever and resolving leukocytosis. Signs of superinfection.'
  };
}
function cephBase(){
  return {
    sfx:'Prefix cef- or ceph-.',
    how:'Beta-lactams, structurally similar to penicillins. They inhibit bacterial cell wall synthesis. Bactericidal.',
    contra:'History of anaphylaxis to a penicillin, because of the shared beta-lactam ring. A patient allergic to cephalosporins may react to penicillins too.',
    ae:'Pruritus and GI distress. At high doses, increased bleeding (some cause thrombocytopenia) and seizures, mainly in patients with renal dysfunction. Superinfection.',
    admin:'Take an allergy history with specific attention to penicillin. Some are oral, others IM or IV. Teach no alcohol and backup contraception.',
    inter:'Alcohol causes a disulfiram-like reaction: flushing, dizziness, headache, nausea, vomiting, and muscle cramps. May make oral contraceptives ineffective.',
    mon:'Liver and kidney function. Signs of allergic reaction, of improving infection (falling fever, resolving leukocytosis), and of secondary infection.'
  };
}
function abxCard(t, f){
  const order = [
    ['sfx','Suffix or prefix'],
    ['how','How it works'],
    ['use','What it is used for'],
    ['contra','Contraindications and cautions'],
    ['ae','Major side effects and adverse effects'],
    ['admin','Administration and patient teaching'],
    ['inter','Drug and food interactions'],
    ['mon','What the nurse monitors']
  ];
  return {
    t,
    sections: order.filter(([k])=>f[k]).map(([k,h])=>({h, p:f[k]})),
    list: f.differs ? {h:'What sets each drug apart', items:f.differs} : null
  };
}
